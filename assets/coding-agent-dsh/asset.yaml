id: coding-agent-dsh
name: dsh as a bug-fix agent
kind: agent
maturity: experimental
owner: ai-coe
description: >
  DeepSeek's dsh driven over the Agent Client Protocol in a sandbox with no network route out. It gets a bug
  report and a fresh checkout of the starting commit, and returns a diff for a person to review.
use_cases:
  - first attempt at a reported bug in a Python service, with the fix reviewed before merge
models: [deepseek-v4-pro]
data_classification: internal
personal_data: false
source:
  repository: https://github.com/kinhdx/coding-agent-trial
  path: src/trial/harnesses.py
  version: 3d81f84
evaluation:
  dataset: tasks/
  dataset_size: 11
  report: https://github.com/kinhdx/coding-agent-trial/blob/3d81f84/results/main/report.md
  date: 2026-10-11
  metrics:
    resolved_pct: 100
    usd_per_resolved: 0.077
    median_agent_seconds: 139
    egress_attempts_outside_allowlist: 0
  thresholds:
    resolved_pct: {op: ">=", value: 80}
    usd_per_resolved: {op: "<=", value: 0.25}
    egress_attempts_outside_allowlist: {op: "<=", value: 0}
safeguards:
  - runs in a container on an internal network; the only route out is a gateway that relays model calls
  - the sandbox holds a placeholder key; the gateway adds the real key and enforces a spending budget
  - an egress proxy tunnels only allowlisted hosts and logs every attempt
  - telemetry disabled (DSH_TELEMETRY_MODE=DISABLED)
human_oversight: >
  The agent works on a throwaway checkout and its output is a diff. Nothing reaches a branch until a person
  reviews the diff and the test results.
limitations:
  - kept experimental although it met every threshold, for two reasons below
  - the version measured, 0.2.0-rc.2, is a release candidate
  - in workspace-write mode it runs tools without asking for permission, so the permission policy that applies
    to the other two harnesses does not apply; containment is the sandbox and the network alone
  - 11 tasks from three small Python repositories, one attempt each; every harness resolved all of them
  - prices use DeepSeek's peak rate, so the off-peak cost is lower than stated
