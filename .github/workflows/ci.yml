name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"  # weekly, so overdue reviews fail without a pull request

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run registry validate
      - run: uv run registry catalog --check
